<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" class="mangekyo-svg">
  <defs>
    <!-- Deep Blood Crimson Iris Gradient -->
    <radialGradient id="mangekyo-iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="25%" stop-color="#4d0000"/>
      <stop offset="60%" stop-color="#990000"/>
      <stop offset="85%" stop-color="#cc0000"/>
      <stop offset="96%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#550000"/>
    </radialGradient>

    <!-- Crimson Bloom Filter -->
    <filter id="mangekyo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="blade-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140202"/>
      <stop offset="40%" stop-color="#0a0000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Ambient Outer Crimson Aura -->
  <circle cx="300.0" cy="300.0" r="296.0" fill="none" stroke="rgba(255, 0, 0, 0.15)" stroke-width="2" stroke-dasharray="14,6"/>
  <circle cx="300.0" cy="300.0" r="282.0" fill="none" stroke="rgba(255, 0, 0, 0.28)" stroke-width="1.8"/>
  <circle cx="300.0" cy="300.0" r="270.0" fill="rgba(204, 0, 0, 0.18)" filter="url(#mangekyo-glow)"/>

  <!-- Main Crimson Iris Circle -->
  <circle cx="300.0" cy="300.0" r="264.0" fill="url(#mangekyo-iris)" stroke="#ff0000" stroke-width="4" stroke-opacity="0.9"/>

  <!-- Inner Reticle Rings -->
  <circle cx="300.0" cy="300.0" r="240.0" fill="none" stroke="#ff2222" stroke-width="2" stroke-dasharray="8,5" stroke-opacity="0.6"/>
  <circle cx="300.0" cy="300.0" r="150.0" fill="none" stroke="rgba(255, 0, 0, 0.4)" stroke-width="1.2" stroke-dasharray="4,6"/>

  <!-- Hypnotic Rotating Mangekyo Pinwheel Group -->
  <g class="mangekyo-pinwheel">
    <g transform="rotate(0 300.0 300.0)">
    <path d="M 300.0,252.0
             C 330.0,210.0 400.0,110.0 495.0,155.0
             C 540.0,190.0 550.0,260.0 505.0,315.0
             C 475.0,355.0 425.0,340.0 400.0,315.0
             C 370.0,285.0 335.0,305.0 300.0,348.0
             C 285.0,305.0 285.0,295.0 300.0,252.0 Z"
          fill="url(#blade-grad)"
          stroke="#ff0000"
          stroke-width="2.2"
          stroke-opacity="0.5"/>
    <path d="M 360.0,220.0 Q 440.0,170.0 490.0,215.0"
          fill="none"
          stroke="#ff0000"
          stroke-width="1.5"
          stroke-opacity="0.4"/>
    </g>
    <g transform="rotate(120 300.0 300.0)">
    <path d="M 300.0,252.0
             C 330.0,210.0 400.0,110.0 495.0,155.0
             C 540.0,190.0 550.0,260.0 505.0,315.0
             C 475.0,355.0 425.0,340.0 400.0,315.0
             C 370.0,285.0 335.0,305.0 300.0,348.0
             C 285.0,305.0 285.0,295.0 300.0,252.0 Z"
          fill="url(#blade-grad)"
          stroke="#ff0000"
          stroke-width="2.2"
          stroke-opacity="0.5"/>
    <path d="M 360.0,220.0 Q 440.0,170.0 490.0,215.0"
          fill="none"
          stroke="#ff0000"
          stroke-width="1.5"
          stroke-opacity="0.4"/>
    </g>
    <g transform="rotate(240 300.0 300.0)">
    <path d="M 300.0,252.0
             C 330.0,210.0 400.0,110.0 495.0,155.0
             C 540.0,190.0 550.0,260.0 505.0,315.0
             C 475.0,355.0 425.0,340.0 400.0,315.0
             C 370.0,285.0 335.0,305.0 300.0,348.0
             C 285.0,305.0 285.0,295.0 300.0,252.0 Z"
          fill="url(#blade-grad)"
          stroke="#ff0000"
          stroke-width="2.2"
          stroke-opacity="0.5"/>
    <path d="M 360.0,220.0 Q 440.0,170.0 490.0,215.0"
          fill="none"
          stroke="#ff0000"
          stroke-width="1.5"
          stroke-opacity="0.4"/>
    </g>

    <!-- Center Black Pupil -->
    <circle cx="300.0" cy="300.0" r="48.0" fill="#000000" stroke="#ff0000" stroke-width="3.5" stroke-opacity="0.95"/>
    <!-- Glowing Crimson Pupil Center -->
    <circle cx="300.0" cy="300.0" r="25.000000000000004" fill="#8b0000"/>
    <circle cx="300.0" cy="300.0" r="21.000000000000004" fill="#ff0000" filter="drop-shadow(0 0 10px #ff0000)"/>
    <circle cx="300.0" cy="300.0" r="3" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- 12 Cardinal Tomoe Stigma Ticks on Ring -->
  <line x1="534.0" y1="300.0" x2="546.0" y2="300.0" stroke="#ff3333" stroke-width="2" stroke-opacity="0.65"/>
  <line x1="502.6" y1="417.0" x2="513.0" y2="423.0" stroke="#ff3333" stroke-width="2" stroke-opacity="0.65"/>
  <line x1="417.0" y1="502.6" x2="423.0" y2="513.0" stroke="#ff3333" stroke-width="2" stroke-opacity="0.65"/>
  <line x1="300.0" y1="534.0" x2="300.0" y2="546.0" stroke="#ff3333" stroke-width="2" stroke-opacity="0.65"/>
  <line x1="183.0" y1="502.6" x2="177.0" y2="513.0" stroke="#ff3333" stroke-width="2" stroke-opacity="0.65"/>
  <line x1="97.4" y1="417.0" x2="87.0" y2="423.0" stroke="#ff3333" stroke-width="2" stroke-opacity="0.65"/>
  <line x1="66.0" y1="300.0" x2="54.0" y2="300.0" stroke="#ff3333" stroke-width="2" stroke-opacity="0.65"/>
  <line x1="97.4" y1="183.0" x2="87.0" y2="177.0" stroke="#ff3333" stroke-width="2" stroke-opacity="0.65"/>
  <line x1="183.0" y1="97.4" x2="177.0" y2="87.0" stroke="#ff3333" stroke-width="2" stroke-opacity="0.65"/>
  <line x1="300.0" y1="66.0" x2="300.0" y2="54.0" stroke="#ff3333" stroke-width="2" stroke-opacity="0.65"/>
  <line x1="417.0" y1="97.4" x2="423.0" y2="87.0" stroke="#ff3333" stroke-width="2" stroke-opacity="0.65"/>
  <line x1="502.6" y1="183.0" x2="513.0" y2="177.0" stroke="#ff3333" stroke-width="2" stroke-opacity="0.65"/>
</svg>